name: Check Questions Sorted

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.ru.md'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'README.ru.md'

jobs:
  check-sorting:
    name: Verify Questions Alphabetical Order
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check questions are sorted alphabetically
        run: bun run .github/workflows/check-questions-sorted.mjs

      - name: Report success
        if: success()
        run: echo "✓ All questions are sorted alphabetically by question text"
