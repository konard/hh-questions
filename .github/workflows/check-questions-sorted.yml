name: Check Questions Sorted

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.ru.md'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'README.ru.md'

jobs:
  check-sorting:
    name: Verify Questions Alphabetical Order
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check questions are sorted alphabetically
        run: python .github/workflows/check-questions-sorted.py

      - name: Report success
        if: success()
        run: echo "✓ All questions are sorted alphabetically by directory name"
